spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${NEXA_MYSQL_HOST:192.168.0.134}:${NEXA_MYSQL_PORT:3306}/${NEXA_MYSQL_DATABASE:nexa_rag}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${NEXA_MYSQL_USERNAME:root}
    password: ${NEXA_MYSQL_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
  data:
    redis:
      host: ${NEXA_REDIS_HOST:192.168.0.134}
      port: ${NEXA_REDIS_PORT:6379}
      password: ${NEXA_REDIS_PASSWORD:}
      timeout: ${NEXA_REDIS_TIMEOUT:3s}

# 集成环境RocketMQ连接配置，默认使用已确认可用的NameServer。
rocketmq:
  name-server: ${NEXA_ROCKETMQ_NAME_SERVER:118.195.146.161:8082}
  producer:
    group: ${NEXA_ROCKETMQ_PRODUCER_GROUP:nexa-document-pipeline-producer}

nexa:
  document:
    pipeline:
      messaging:
        type: ${NEXA_DOCUMENT_MESSAGING_TYPE:ROCKETMQ} # 当前可用值为ROCKETMQ。
        publish-mode: ${NEXA_DOCUMENT_PUBLISH_MODE:OUTBOX} # 当前可用值为OUTBOX。
        topic: ${NEXA_DOCUMENT_PIPELINE_TOPIC:nexa-document-pipeline}
        failure-topic: ${NEXA_DOCUMENT_FAILURE_TOPIC:nexa-document-pipeline-failure}
        consumer-group: ${NEXA_DOCUMENT_CONSUMER_GROUP:nexa-document-pipeline-worker}
        failure-consumer-group: ${NEXA_DOCUMENT_FAILURE_CONSUMER_GROUP:nexa-document-pipeline-failure-handler}
        max-reconsume-times: ${NEXA_DOCUMENT_MAX_RECONSUME_TIMES:5}
  integration:
    enabled: ${NEXA_INTEGRATION_ENABLED:false}
    mysql:
      validation-query: SELECT 1
    elasticsearch:
      scheme: ${NEXA_ELASTICSEARCH_SCHEME:http}
      host: ${NEXA_ELASTICSEARCH_HOST:192.168.0.134}
      port: ${NEXA_ELASTICSEARCH_PORT:9200}
      username: ${NEXA_ELASTICSEARCH_USERNAME:elastic}
      password: ${NEXA_ELASTICSEARCH_PASSWORD:}
    milvus:
      host: ${NEXA_MILVUS_HOST:192.168.0.134}
      port: ${NEXA_MILVUS_PORT:19530}
