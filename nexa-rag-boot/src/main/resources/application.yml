server:
  port: 8009

spring:
  application:
    name: nexa-rag
  main:
    banner-mode: console
  mustache:
    check-template-location: false
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:ollama}
      base-url: ${OPENAI_BASE_URL:http://localhost:11434/v1}
  flyway:
    enabled: false
  data:
    redis:
      host: ${NEXA_REDIS_HOST:192.168.0.134}
      port: ${NEXA_REDIS_PORT:6379}
      password: ${NEXA_REDIS_PASSWORD:}
      timeout: ${NEXA_REDIS_TIMEOUT:3s}

nexa:
  config-center:
    type: local
    fallback-to-local: true
  document:
    pipeline:
      mode: local
      queue-mode: pipeline
      worker-enabled: ${NEXA_DOCUMENT_PIPELINE_WORKER_ENABLED:false}
      max-concurrency: 2
      max-retry-count: 3
      poll-interval-ms: ${NEXA_DOCUMENT_PIPELINE_POLL_INTERVAL_MS:1000}
      lease-ttl-seconds: ${NEXA_DOCUMENT_PIPELINE_LEASE_TTL_SECONDS:300}
      queue:
        key-prefix: ${NEXA_DOCUMENT_PIPELINE_QUEUE_KEY_PREFIX:nexa:document:pipeline}
        lease-ttl-seconds: ${NEXA_DOCUMENT_PIPELINE_LEASE_TTL_SECONDS:300}
        retry-ttl-seconds: ${NEXA_DOCUMENT_PIPELINE_RETRY_TTL_SECONDS:86400}
  storage:
    minio:
      endpoint: ${NEXA_MINIO_ENDPOINT:http://127.0.0.1:9000}
      access-key: ${NEXA_MINIO_ACCESS_KEY:}
      secret-key: ${NEXA_MINIO_SECRET_KEY:}
      bucket: ${NEXA_MINIO_BUCKET:nexa-rag}
      create-bucket: true
  retrieval:
    rerank:
      type: score_fusion
      vector-weight: 0.7
      keyword-weight: 0.3
  model:
    profiles:
      chat-primary:
        provider: OPENAI_COMPATIBLE
        base-url: http://localhost:11434/v1
        api-key: ollama
        model-name: qwen2.5:7b
        timeout-ms: 60000
      chat-backup:
        provider: OPENAI_COMPATIBLE
        base-url: http://localhost:11434/v1
        api-key: ollama
        model-name: qwen2.5:7b
        timeout-ms: 60000
      embedding-primary:
        provider: OPENAI_COMPATIBLE
        base-url: http://localhost:11434/v1
        api-key: ollama
        model-name: nomic-embed-text
        timeout-ms: 60000
      rerank-primary:
        provider: OPENAI_COMPATIBLE
        base-url: http://localhost:11434/v1
        api-key: ollama
        model-name: qwen2.5:7b
        timeout-ms: 60000
    routes:
      chat:
        type: PRIMARY_FALLBACK
        primary: chat-primary
        fallback: chat-backup
      embedding:
        type: PRIMARY_FALLBACK
        primary: embedding-primary
      rerank:
        type: PRIMARY_FALLBACK
        primary: rerank-primary
