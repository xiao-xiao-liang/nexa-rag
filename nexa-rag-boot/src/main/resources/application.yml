server:
  port: 8009

spring:
  application:
    name: nexa-rag
  mail:
    host: smtp.qq.com # QQ邮箱SMTP主机。
    port: 465 # QQ邮箱SSL端口。
    username: ${NEXA_ALERT_SMTP_USERNAME:} # SMTP认证邮箱，可通过 IDEA 环境变量配置。
    password: ${NEXA_ALERT_SMTP_PASSWORD:} # SMTP授权码，不使用邮箱登录密码。
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true # QQ邮箱SMTP使用SSL。
  main:
    banner-mode: console
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 110MB
  flyway:
    enabled: false
  data:
    redis:
      host: 192.168.0.134 # 127.0.0.1
      port: 6379
      password: 
      timeout: 3s
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://192.168.0.134:3306/nexa_rag?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password:  # root
  elasticsearch:
    uris: http://192.168.0.134:9200 # Spring Data Elasticsearch 连接地址。
    username: elastic # Elasticsearch 用户名。
    password:  # Elasticsearch 密码。
    socket-timeout: 30s # Elasticsearch 请求超时时间。

# RocketMQ连接配置。name-server为NameServer地址，多个地址使用分号分隔；producer.group为全局生产者组名称。
rocketmq:
  name-server: 118.195.146.161:9876 # RocketMQ NameServer地址，默认连接局域网开发环境。
  producer:
    group: nexa-document-pipeline-producer # 文档流水线生产者组，同一应用集群应保持一致。

nexa:
  cloud-document:
    yuque:
      token: ${NEXA_SOURCE_YUQUE_TOKEN:}
    feishu:
      app-id: ${NEXA_SOURCE_FEISHU_APP_ID:}
      app-secret: ${NEXA_SOURCE_FEISHU_APP_SECRET:}
      export:
        timeout: 120s
        poll-interval: 2s
        max-poll-count: 60
  prompt:
    refresh:
      topic: nexa.prompt.release.changed
      reconcile-interval-ms: 60000
  alert:
    enabled: true # 是否启用外部告警投递；开启后同时暴露告警渠道测试接口。
    topic: nexa-alert # 告警消息主题。
    consumer-group: nexa-alert-worker # 告警消息消费者组。
    feishu:
      enabled: true # 是否启用飞书机器人渠道。
      webhook-url: ${NEXA_ALERT_FEISHU_WEBHOOK_URL:} # 飞书Webhook，仅通过环境变量配置。
    email:
      enabled: true # 是否启用邮件渠道。
      from: "2901815578@qq.com" # 告警邮件发件人地址，填写发件QQ邮箱。
      recipients: "2720370245@qq.com" # 告警邮件收件人，多个以逗号分隔。
  # 文档上传和异步处理流水线配置。
  document:
    upload:
      rate-limit:
        enabled: true # 是否启用文档上传入口限流，可选值：true、false。
        semaphore-name: nexa:document:upload # 文档上传分布式信号量名称。
        max-concurrent: 10 # 文档上传最大并发请求数。
        max-wait-seconds: 5 # 获取上传许可最大等待时间，单位：秒。
        lease-seconds: 300 # 上传许可自动释放时间，单位：秒。
    pipeline:
      # 消息中间件配置：当前仅支持ROCKETMQ，REDIS_STREAM属于后续预留适配目标。
      messaging:
        type: ROCKETMQ # 消息中间件类型，当前必须为ROCKETMQ。
        publish-mode: OUTBOX # 发布模式当前仅支持OUTBOX，TRANSACTION_MESSAGE属于后续预留适配目标。
        topic: nexa-document-pipeline # 正常流水线消息主题。
        failure-topic: nexa-document-pipeline-failure # 不可重试异常的业务失败主题。
        consumer-group: nexa-document-pipeline-worker # 正常流水线消费者组。
        failure-consumer-group: nexa-document-pipeline-failure-handler # 业务失败和死信处理消费者组前缀。
        max-reconsume-times: 5 # RocketMQ最大重新消费次数，最小值为0；监听器当前按5次配置。
      # Outbox发布配置：负责将数据库待发布记录可靠投递到RocketMQ。
      outbox:
        batch-size: 100 # 单次扫描最大记录数，最小值为1。
        poll-interval-ms: 1000 # Outbox扫描间隔，单位：毫秒，最小值为100。
        publishing-timeout-seconds: 60 # PUBLISHING状态抢占超时，单位：秒，最小值为1。
        max-publish-retries: 10 # 消息发布最大尝试次数，最小值为1。
        initial-retry-delay-seconds: 5 # 首次发布重试延迟，单位：秒，最小值为1。
        max-retry-delay-seconds: 300 # 指数退避最大延迟，单位：秒，且不应小于首次延迟。
      # 对象存储上传瞬时失败退避配置；列表长度即最大尝试次数。
      upload-retry:
        backoff-millis: [200, 500, 1000] # 每次失败后的退避时间，单位：毫秒，元素不能小于0。
    task:
      cleanup-topic: nexa-document-index-cleanup # 删除文档后的外部索引清理主题
      cleanup-consumer-group: nexa-document-index-cleanup-worker # 索引清理消费者组
      max-reconsume-times: 5 # 索引清理任务的RocketMQ最大重新消费次数

  # 文件存储配置，用于控制文档原始文件和解析产物的存取位置。
  storage:
    type: MINIO # 存储类型，可选值：MINIO、RUSTFS、OSS、QINIU、LOCAL。
    endpoint: http://127.0.0.1:9000 # 对象存储服务地址。
    access-key: liang  # 对象存储访问密钥。
    secret-key: liang123 # 对象存储访问密钥密码。
    bucket: nexa-rag # 文档对象存储桶名称。
    create-bucket: true # 存储桶不存在时是否自动创建，可选值：true、false。

  # 文档解析器配置，用于控制 MinerU、Tika 和直通解析器的启停及连接参数。
  parser:
    artifact:
      temp-root: ${NEXA_ARTIFACT_TEMP_ROOT:${java.io.tmpdir}/nexa-rag-artifacts}
      max-workspace-bytes: 524288000
      max-concurrent: 2
      structure:
        heuristic-heading-enabled: true
        heuristic-heading-min-confidence: 0.80
        max-diagnostics: 100
        llm-fallback:
          enabled: false # 默认关闭；评测达标后再按需开启。
          route-key: chat # 开启时使用的模型路由键。
          candidate-max-confidence: 0.80 # 仅精修不高于该置信度的既有标题。
          accepted-min-confidence: 0.85 # 仅接受高于该阈值的模型判断。
          max-candidates: 20 # 单篇文档最多发送的标题数量。
    pandoc:
      enabled: true
      executable: ${NEXA_PANDOC_EXECUTABLE:D:\Software\笔记&协助\pandoc-3.1.13\pandoc.exe}
      timeout: 120s
      max-stderr-bytes: 8192
    mineru:
      enabled: true # 是否启用 MinerU 解析器，可选值：true、false。
      mode: official # MinerU 调用模式，可选值：LOCAL、OFFICIAL；配置时大小写均可绑定。
      local-endpoint: http://127.0.0.1:8000  # 本地 MinerU 服务地址，仅 mode=LOCAL 时使用。
      local-parse-path: /file_parse # 本地 MinerU 文件解析接口路径，仅 mode=LOCAL 时使用。
      official-endpoint: https://mineru.net # 官方 MinerU 服务地址，仅 mode=OFFICIAL 时使用；为空时默认使用 https://mineru.net。
      api-key: ${MINERU_TOKEN:} # 官方 MinerU API Key，仅 mode=OFFICIAL 时使用。
      connect-timeout: 3s # MinerU 客户端连接超时时间。
      read-timeout: 120s # MinerU 客户端读取超时时间。
      poll-interval: 2s # 官方 MinerU 异步任务轮询间隔。
      max-poll-count: 60 # 官方 MinerU 异步任务最大轮询次数。
      concurrency-limit: 5 # MinerU 全局最大并发解析任务数。
      semaphore-name: nexa:mineru:parse # MinerU 解析分布式信号量名称。
      max-wait-seconds: 30 # 获取 MinerU 解析许可最大等待时间，单位：秒。
      lease-seconds: 900 # MinerU 解析许可自动释放时间，单位：秒。

  # 检索索引配置，用于控制文档片段向量化、向量索引和关键词索引适配器。
  retrieval:
    embedding:
      type: model # 向量化类型，可选值：model。由 ModelGateway 调用模型。
      route-key: embedding # ModelGateway 向量化路由Key。
      max-batch-size: 10 # 单次向量化最大片段数量，避免超过云端 Embedding 接口限制。
    # 候选阶段初始召回导向参数，后续应根据 RAGAS 评估结果持续校准，不能视为单一案例常量。
    candidate:
      vector-candidate-limit: 20 # 向量通道初始候选数量。
      keyword-candidate-limit: 20 # 关键词通道初始候选数量。
      coarse-score-floor: 0.0 # 初筛保留分数下限，优先保障召回。
      rrf-candidate-limit: 20 # RRF 融合后保留的候选数量。
      rerank-candidate-limit: 12 # 重排序后保留的候选数量。
      expansion-candidate-limit: 8 # 触发扩召时使用的候选数量。
      expansion-evidence-limit: 3 # 章节范围扩展最多补充的原始正文数量。
      evidence-token-budget: 1800 # 最终回答允许使用的原始正文 Token 预算。
      expansion-minimum-body-tokens: 64 # 初始正文少于此估算 Token 数时触发章节扩展。
      expansion-confidence-threshold: 0.1 # 初始正文最高相关度低于此值时触发章节扩展。
      accepted-rerank-score: 0.0 # 重排序结果最低可接受分数。
      parent-context-expansion-enabled: true # 重排序后是否按父子关系补全上下文。
      parent-context-full-parent-max-tokens: 800 # 可直接使用完整父片段的估算 Token 上限。
      parent-context-full-parent-minimum-hits: 2 # 同一父片段达到该命中数时可放宽为完整父片段。
      parent-context-neighbor-window-count: 1 # 未使用完整父片段时，每侧补充的相邻子片段数量。
    vector:
      type: milvus # 向量索引类型，可选值：milvus。
      host: 192.168.0.134 # 101.132.158.169 # 向量索引服务地址。
      port: 19530 # 向量索引服务端口。
      database-name: nexa_rag # 向量库数据库名称，为空时使用默认数据库。
      collection-name: nexa_document_chunk # 文档片段向量集合名称。
      dimension: 1024 # 必须与当前 Gateway 生效 Embedding 模型返回的向量维度一致。
      username: # 向量索引服务用户名，未启用鉴权时为空。
      password: # 向量索引服务密码，未启用鉴权时为空。
      rpc-deadline-ms: 60000 # 向量索引 RPC 超时时间，单位：毫秒。
    keyword:
      type: elasticsearch # elasticsearch # 关键词索引类型，可选值：none/elasticsearch。
      index-name: nexa_document_chunk # 文档片段关键词索引名称。

  # 模型治理配置，用于控制模型路由、Profile、密钥加密和注册表刷新。
  model:
    registry:
      # 模型注册表刷新通道：LOCAL=仅刷新当前实例，REDIS_PUB_SUB=Redis发布订阅通知多实例，INFRA_MQ=预留统一MQ通道。
      refresh-channel: REDIS_PUB_SUB
      # 模型注册表刷新消息主题；REDIS_PUB_SUB 模式下发布和订阅都使用该主题。
      refresh-topic: nexa.model.registry.changed
    secret:
      master-key: = # 模型 API Key 加密主密钥。
    governance:
      # 治理配置绑定模式：CONFIG=按模型配置生效，ROUTE=按业务路由生效；同一时间只生效一种模式。
      binding-mode: CONFIG
      # 新增模型配置时是否自动创建默认治理配置；默认治理值可在管理接口中继续调整。
      auto-create-default: true
    profiles:
      chat-primary:
        provider: OPENAI_COMPATIBLE
        base-url: http://localhost:11434/v1
        api-key: ollama
        model-name: qwen2.5:7b
        timeout-ms: 60000
      chat-backup:
        provider: OPENAI_COMPATIBLE
        base-url: http://localhost:11434/v1
        api-key: ollama
        model-name: qwen2.5:7b
        timeout-ms: 60000
      embedding-primary:
        provider: OPENAI_COMPATIBLE
        base-url: http://localhost:11434/v1
        api-key: ollama
        model-name: nomic-embed-text
        timeout-ms: 60000
      rerank-primary:
        provider: OPENAI_COMPATIBLE
        base-url: http://localhost:11434/v1
        api-key: ollama
        model-name: qwen2.5:7b
        timeout-ms: 60000
    # 模型路由集合，key 为业务路由名，调用方通过 routeKey 选择具体模型路由。
    routes:
      chat:
        # 路由类型，可选值：PRIMARY_FALLBACK。
        type: PRIMARY_FALLBACK
        # 主用模型 Profile 名称。
        primary: chat-primary
        # 备用模型 Profile 名称，仅主用调用失败时使用。
        fallback: chat-backup
      answer:
        # Answer 节点路由，和数据库默认路由保持一致。
        type: PRIMARY_FALLBACK
        primary: chat-primary
        fallback: chat-backup
      embedding:
        # 路由类型，可选值：PRIMARY_FALLBACK。
        type: PRIMARY_FALLBACK
        # 主用模型 Profile 名称。
        primary: embedding-primary
      rerank:
        # 路由类型，可选值：PRIMARY_FALLBACK。
        type: PRIMARY_FALLBACK
        # 主用模型 Profile 名称。
        primary: rerank-primary

# 对话排查日志：DEBUG 会输出原始问题、节点完整结果和渲染后的提示词。
logging:
  level:
    com.nexarag.boot.controller.ChatController: INFO
    com.nexarag.workflow.node.chat: INFO
    com.nexarag.workflow.dispatcher.chat: INFO
    com.nexarag.model.gateway.ModelGateway: INFO
